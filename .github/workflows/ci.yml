name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            fixtures/frameworks/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - if: matrix.node == 24
        run: pnpm lint && pnpm format:check && pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js --help
      - if: matrix.node == 24
        run: node scripts/run-framework-trials.mjs
      - if: matrix.node == 22
        run: pnpm package:check
      - if: matrix.node == 24
        run: pnpm --filter docs-trials-site check && pnpm --filter docs-trials-site build
      - if: matrix.node == 24
        run: pnpm --filter docs-trials-site exec wrangler deploy --dry-run

  macos:
    name: macOS / Node 22
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium chromium-headless-shell
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:check
